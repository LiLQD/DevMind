name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ── Backend ──
  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Check syntax (server.js)
        run: node --check src/server.js

      - name: Check all controllers & routes syntax
        run: |
          find src -name "*.js" -exec node --check {} \;

      - name: Run lint (optional)
        # You can add eslint later if needed
        run: echo "Backend syntax checks passed"

  # ── Frontend ──
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Check for missing imports (dry-run)
        run: pnpm build -- --watch false || echo "Build check done"

      - name: Verify static assets exist
        run: test -d dist && echo "Build produced dist folder"
